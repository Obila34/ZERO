    <rect x="78" y="158" width="660" height="260" fill="none" stroke="#8A8172" stroke-width="0.5"/><rect x="70" y="150" width="660" height="260" fill="none" stroke="#25231B" stroke-width="1.6"/><rect x="70" y="150" width="14" height="260" fill="#B85425" opacity="0.7"/><text x="104" y="190" font-size="23" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="bold"
        letter-spacing="2" font-style="normal">SCHEMA DRIFT</text><line x1="104" y1="204" x2="706" y2="204" stroke="#25231B" stroke-width="0.8"/><text x="104" y="240" font-size="18" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">zero/vision/schemas.py and server/vision/shared/schemas.py</text><text x="104" y="262" font-size="18" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">have diverged. The sync_schemas.py script referenced in the</text><text x="104" y="284" font-size="18" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">docstring does not exist in the repository.</text><rect x="778" y="158" width="660" height="260" fill="none" stroke="#8A8172" stroke-width="0.5"/><rect x="770" y="150" width="660" height="260" fill="none" stroke="#25231B" stroke-width="1.6"/><rect x="770" y="150" width="14" height="260" fill="#B85425" opacity="0.7"/><text x="804" y="190" font-size="23" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="bold"
        letter-spacing="2" font-style="normal">HALF_LIFE_DAYS  NAME</text><line x1="804" y1="204" x2="1406" y2="204" stroke="#25231B" stroke-width="0.8"/><text x="804" y="240" font-size="18" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">Used as a time constant, not a half life. Rename the key or</text><text x="804" y="262" font-size="18" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">divide by ln(2) on read; either resolves the surprise for</text><text x="804" y="284" font-size="18" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">anyone tuning it.</text><rect x="78" y="448" width="660" height="260" fill="none" stroke="#8A8172" stroke-width="0.5"/><rect x="70" y="440" width="660" height="260" fill="none" stroke="#25231B" stroke-width="1.6"/><rect x="70" y="440" width="14" height="260" fill="#B85425" opacity="0.7"/><text x="104" y="480" font-size="23" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="bold"
        letter-spacing="2" font-style="normal">FILLER PRE-SYNTH</text><line x1="104" y1="494" x2="706" y2="494" stroke="#25231B" stroke-width="0.8"/><text x="104" y="530" font-size="18" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">Aborts silently after two consecutive TTS failures. Add a</text><text x="104" y="552" font-size="18" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">counter to the status endpoint so the state is visible before</text><text x="104" y="574" font-size="18" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">it becomes silence.</text><rect x="778" y="448" width="660" height="260" fill="none" stroke="#8A8172" stroke-width="0.5"/><rect x="770" y="440" width="660" height="260" fill="none" stroke="#25231B" stroke-width="1.6"/><rect x="770" y="440" width="14" height="260" fill="#B85425" opacity="0.7"/><text x="804" y="480" font-size="23" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="bold"
        letter-spacing="2" font-style="normal">CONTROL PLANE AUTH</text><line x1="804" y1="494" x2="1406" y2="494" stroke="#25231B" stroke-width="0.8"/><text x="804" y="530" font-size="18" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">The control plane binds 0.0.0.0 with no auth, a deliberate</text><text x="804" y="552" font-size="18" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">trade for a LAN only device. If the deployment target changes,</text><text x="804" y="574" font-size="18" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">add a signed token in the header set.</text><rect x="78" y="738" width="660" height="260" fill="none" stroke="#8A8172" stroke-width="0.5"/><rect x="70" y="730" width="660" height="260" fill="none" stroke="#25231B" stroke-width="1.6"/><rect x="70" y="730" width="14" height="260" fill="#B85425" opacity="0.7"/><text x="104" y="770" font-size="23" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="bold"
        letter-spacing="2" font-style="normal">VAD DEFAULT vs SHIPPED</text><line x1="104" y1="784" x2="706" y2="784" stroke="#25231B" stroke-width="0.8"/><text x="104" y="820" font-size="18" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">Factory defaults to silero; config.yaml overrides to webrtc. A</text><text x="104" y="842" font-size="18" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">reader of the factory in isolation draws the wrong conclusion.</text><text x="104" y="864" font-size="18" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">Reflect the choice in the default.</text><rect x="778" y="738" width="660" height="260" fill="none" stroke="#8A8172" stroke-width="0.5"/><rect x="770" y="730" width="660" height="260" fill="none" stroke="#25231B" stroke-width="1.6"/><rect x="770" y="730" width="14" height="260" fill="#B85425" opacity="0.7"/><text x="804" y="770" font-size="23" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="bold"
        letter-spacing="2" font-style="normal">EPISODE CONSOLIDATION</text><line x1="804" y1="784" x2="1406" y2="784" stroke="#25231B" stroke-width="0.8"/><text x="804" y="820" font-size="18" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">The nightly consolidation job is scaffolded but off by</text><text x="804" y="842" font-size="18" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">default. Its win over ordinary memory writes has not been</text><text x="804" y="864" font-size="18" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">measured yet on this subsystem.</text>
