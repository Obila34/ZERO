      <path d="M 1482 34 L 1482 18 L 1466 18" stroke="#25231B" stroke-width="0.9" fill="none"/>
      <path d="M 18 1066 L 18 1082 L 34 1082" stroke="#25231B" stroke-width="0.9" fill="none"/>
