        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">grep for slow embed lines in the log</text><rect x="560" y="670" width="440" height="220" fill="none" stroke="#25231B" stroke-width="1.6"/><line x1="560" y1="712" x2="1000" y2="712" stroke="#25231B" stroke-width="0.9"/><text x="574" y="698" font-size="19" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="bold"
        letter-spacing="2" font-style="normal">TRIAGE  ·  DEAF AFTER REPLY</text><text x="574" y="740" font-size="16" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">check monitor thread joined before mic pause</text><text x="574" y="764" font-size="16" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">confirm producer sentinel blocking put in use</text><text x="574" y="788" font-size="16" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">these were the two barge-in shutdown bugs</text><rect x="1040" y="150" width="440" height="220" fill="none" stroke="#25231B" stroke-width="1.6"/><line x1="1040" y1="192" x2="1480" y2="192" stroke="#25231B" stroke-width="0.9"/><text x="1054" y="178" font-size="19" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="bold"
        letter-spacing="2" font-style="normal">DEPLOY A CONFIG CHANGE</text><text x="1054" y="220" font-size="16" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">1.  edit config.local.yaml</text><text x="1054" y="244" font-size="16" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">2.  systemctl restart zero</text><text x="1054" y="268" font-size="16" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">3.  journalctl -u zero -f</text><text x="1054" y="292" font-size="16" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">4.  curl /health, wait for ready:true</text><rect x="1040" y="410" width="440" height="220" fill="none" stroke="#25231B" stroke-width="1.6"/><line x1="1040" y1="452" x2="1480" y2="452" stroke="#25231B" stroke-width="0.9"/><text x="1054" y="438" font-size="19" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="bold"
        letter-spacing="2" font-style="normal">BACKUP</text><text x="1054" y="480" font-size="16" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">stop zero, cp the six sqlite files,</text><text x="1054" y="504" font-size="16" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">cp voiceprint.npy and data/corpus/,</text><text x="1054" y="528" font-size="16" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">start zero.</text><rect x="1040" y="670" width="440" height="220" fill="none" stroke="#25231B" stroke-width="1.6"/><line x1="1040" y1="712" x2="1480" y2="712" stroke="#25231B" stroke-width="0.9"/><text x="1054" y="698" font-size="19" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="bold"
        letter-spacing="2" font-style="normal">RESTORE</text><text x="1054" y="740" font-size="16" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
