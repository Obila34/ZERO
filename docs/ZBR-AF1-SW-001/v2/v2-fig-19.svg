        text-anchor="start" font-family="Courier New, monospace" font-weight="bold"
        letter-spacing="2" font-style="normal">ON THE GPU NODE</text><text x="94" y="220" font-size="16" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">1.  bash scripts/run_gpu_servers.sh</text><text x="94" y="244" font-size="16" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
