        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">if no endpoint commit: check tunnel to :9000</text><rect x="560" y="410" width="440" height="220" fill="none" stroke="#25231B" stroke-width="1.6"/><line x1="560" y1="452" x2="1000" y2="452" stroke="#25231B" stroke-width="0.9"/><text x="574" y="438" font-size="19" fill="#25231B"
