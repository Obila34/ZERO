        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">3.  curl :11434/api/tags   (list of models)</text><rect x="80" y="410" width="440" height="220" fill="none" stroke="#25231B" stroke-width="1.6"/><line x1="80" y1="452" x2="520" y2="452" stroke="#25231B" stroke-width="0.9"/><text x="94" y="438" font-size="19" fill="#25231B"
