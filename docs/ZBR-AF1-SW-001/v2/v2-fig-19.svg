        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">1.  GPU_HOST=... bash scripts/pi_tunnel.sh</text><text x="94" y="504" font-size="16" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">2.  curl 127.0.0.1:9000/health</text><text x="94" y="528" font-size="16" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">3.  curl 127.0.0.1:11435/api/tags</text><rect x="80" y="670" width="440" height="220" fill="none" stroke="#25231B" stroke-width="1.6"/><line x1="80" y1="712" x2="520" y2="712" stroke="#25231B" stroke-width="0.9"/><text x="94" y="698" font-size="19" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="bold"
        letter-spacing="2" font-style="normal">ON THE PI  (ZERO)</text><text x="94" y="740" font-size="16" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">1.  systemctl start zero</text><text x="94" y="764" font-size="16" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">2.  poll 127.0.0.1:8090/health for ready:true</text><text x="94" y="788" font-size="16" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">3.  say the wake word</text><rect x="560" y="150" width="440" height="220" fill="none" stroke="#25231B" stroke-width="1.6"/><line x1="560" y1="192" x2="1000" y2="192" stroke="#25231B" stroke-width="0.9"/><text x="574" y="178" font-size="19" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="bold"
        letter-spacing="2" font-style="normal">TRIAGE  ·  NO REPLY</text><text x="574" y="220" font-size="16" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
        letter-spacing="0" font-style="normal">check vad "listening..." heartbeat</text><text x="574" y="244" font-size="16" fill="#25231B"
        text-anchor="start" font-family="Courier New, monospace" font-weight="normal"
