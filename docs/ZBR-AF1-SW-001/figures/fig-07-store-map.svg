<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <style>
    .ink   { fill:none; stroke:#25231B; stroke-width:2;   stroke-linejoin:round; stroke-linecap:round; }
    .thin  { fill:none; stroke:#25231B; stroke-width:1.2; stroke-linejoin:round; stroke-linecap:round; }
    .hair  { fill:none; stroke:#8A8172; stroke-width:1;   stroke-linejoin:round; stroke-linecap:round; }
    .dash  { fill:none; stroke:#8A8172; stroke-width:1.4; stroke-dasharray:7 6; }
    .sheet { fill:none; stroke:#25231B; stroke-width:1.6; }
    .rule  { fill:none; stroke:#17150E; stroke-width:1.2; }
    .cabO  { fill:none; stroke:#25231B; stroke-width:9;   stroke-linecap:butt; }
    .cabI  { fill:none; stroke:#FFFFFF; stroke-width:5;   stroke-linecap:butt; }
    .cabAO { fill:none; stroke:#D6480C; stroke-width:9;   stroke-linecap:butt; }
    .fill  { fill:#25231B; stroke:none; }
    .fillA { fill:#D6480C; stroke:none; }
    .hdr   { fill:#F2EEE7; stroke:none; }
    .lbl   { font-family:"Courier New",monospace; font-size:16px; letter-spacing:1.8px; fill:#25231B; }
    .row   { font-family:"Courier New",monospace; font-size:13px; letter-spacing:1.2px; fill:#25231B; }
    .sub   { font-family:"Courier New",monospace; font-size:12.5px; letter-spacing:1.2px; fill:#8A8172; }
    .tiny  { font-family:"Courier New",monospace; font-size:10.5px; letter-spacing:1.0px; fill:#8A8172; }
    .acclb { font-family:"Courier New",monospace; font-size:13px;  letter-spacing:1.5px; fill:#D6480C; }
    .tbold { font-family:"Courier New",monospace; font-size:14px;  letter-spacing:1.6px; fill:#17150E; font-weight:bold; }
  </style>
  <rect width="1600" height="1080" fill="#FFFFFF"/>
