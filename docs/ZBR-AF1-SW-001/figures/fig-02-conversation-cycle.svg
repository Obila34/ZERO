<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <style>
    .ink   { fill:none; stroke:#25231B; stroke-width:2;   stroke-linejoin:round; stroke-linecap:round; }
    .thin  { fill:none; stroke:#25231B; stroke-width:1.2; stroke-linejoin:round; stroke-linecap:round; }
    .hair  { fill:none; stroke:#8A8172; stroke-width:1;   stroke-linejoin:round; stroke-linecap:round; }
    .sheet { fill:none; stroke:#25231B; stroke-width:1.6; }
    .rule  { fill:none; stroke:#17150E; stroke-width:1.2; }
    .phase { fill:none; stroke:#25231B; stroke-width:20;  stroke-linecap:butt; }
    .mask  { fill:none; stroke:#FFFFFF; stroke-width:18;  stroke-linecap:butt; }
    .gate  { fill:none; stroke:#D6480C; stroke-width:2.4; stroke-linecap:round; }
    .lbl   { font-family:"Courier New",monospace; font-size:16px; letter-spacing:1.8px; fill:#25231B; }
    .sub   { font-family:"Courier New",monospace; font-size:12.5px; letter-spacing:1.2px; fill:#8A8172; }
    .tiny  { font-family:"Courier New",monospace; font-size:11px;  letter-spacing:1.0px; fill:#8A8172; }
    .acclb { font-family:"Courier New",monospace; font-size:13px;  letter-spacing:1.6px; fill:#D6480C; }
    .tbold { font-family:"Courier New",monospace; font-size:14px;  letter-spacing:1.6px; fill:#17150E; font-weight:bold; }
  </style>

  <rect width="1600" height="1080" fill="#FFFFFF"/>

  <!-- ═══ drawing sheet ═══════════════════════════════════════════ -->
  <rect x="36" y="36" width="1528" height="1008" class="sheet"/>
  <g class="hair">
    <line x1="36" y1="96" x2="76" y2="96"/><line x1="96" y1="36" x2="96" y2="76"/>
    <line x1="1524" y1="96" x2="1564" y2="96"/><line x1="1504" y1="36" x2="1504" y2="76"/>
    <line x1="36" y1="984" x2="76" y2="984"/><line x1="96" y1="1004" x2="96" y2="1044"/>
    <line x1="1524" y1="984" x2="1564" y2="984"/><line x1="1504" y1="1004" x2="1504" y2="1044"/>
  </g>

  <defs>
    <g id="mtick"><line x1="640" y1="248" x2="640" y2="258" class="hair"/></g>
    <g id="Mtick"><line x1="640" y1="248" x2="640" y2="272" class="thin"/></g>
  </defs>

  <!-- ═══ the three conversation phases ═══════════════════════════ -->
  <path d="M 658.30 310.80 A 210 210 0 0 1 830.32 608.75" class="phase"/>
  <path d="M 812.02 640.45 A 210 210 0 0 1 467.98 640.45" class="phase"/>
  <path d="M 449.68 608.75 A 210 210 0 0 1 621.70 310.80" class="phase"/>

  <!-- ═══ the idle bezel ══════════════════════════════════════════ -->
  <circle cx="640" cy="520" r="300" class="ink"/>
  <circle cx="640" cy="520" r="272" class="thin"/>

  <!-- graduation -->
  <g>
    <use href="#mtick" transform="rotate(15 640 520)"/>
    <use href="#mtick" transform="rotate(30 640 520)"/>
    <use href="#mtick" transform="rotate(45 640 520)"/>
    <use href="#mtick" transform="rotate(60 640 520)"/>
    <use href="#mtick" transform="rotate(75 640 520)"/>
    <use href="#mtick" transform="rotate(90 640 520)"/>
    <use href="#mtick" transform="rotate(105 640 520)"/>
    <use href="#mtick" transform="rotate(135 640 520)"/>
    <use href="#mtick" transform="rotate(150 640 520)"/>
    <use href="#mtick" transform="rotate(165 640 520)"/>
    <use href="#mtick" transform="rotate(180 640 520)"/>
    <use href="#mtick" transform="rotate(195 640 520)"/>
    <use href="#mtick" transform="rotate(210 640 520)"/>
    <use href="#mtick" transform="rotate(225 640 520)"/>
    <use href="#mtick" transform="rotate(255 640 520)"/>
    <use href="#mtick" transform="rotate(270 640 520)"/>
    <use href="#mtick" transform="rotate(285 640 520)"/>
    <use href="#mtick" transform="rotate(300 640 520)"/>
    <use href="#mtick" transform="rotate(315 640 520)"/>
    <use href="#mtick" transform="rotate(330 640 520)"/>
    <use href="#mtick" transform="rotate(345 640 520)"/>
    <use href="#Mtick" transform="rotate(0 640 520)"/>
    <use href="#Mtick" transform="rotate(120 640 520)"/>
    <use href="#Mtick" transform="rotate(240 640 520)"/>
  </g>

  <!-- ═══ gates that cross the idle boundary ══════════════════════ -->
  <path d="M 746.03 228.70 L 715.93 311.39" class="mask"/>
  <path d="M 950 520 L 862 520" class="mask"/>

  <path d="M 752.61 231.09 L 722.51 313.78" class="gate"/>
  <path d="M 739.45 226.31 L 709.35 309.00" class="gate"/>
  <path d="M 950 527 L 862 527" class="gate"/>
  <path d="M 950 513 L 862 513" class="gate"/>

  <text x="762" y="206" class="acclb">WAKE WORD</text>
  <text x="962" y="525" class="acclb">SLEEP TIMEOUT</text>

  <!-- ═══ hub ═════════════════════════════════════════════════════ -->
  <circle cx="640" cy="520" r="88" class="thin"/>
  <circle cx="640" cy="520" r="76" class="hair"/>
  <text x="640" y="514" class="lbl" text-anchor="middle">ZERO</text>
  <text x="640" y="540" class="tiny" text-anchor="middle">zero/state.py</text>

  <!-- ═══ phase names ═════════════════════════════════════════════ -->
  <text x="943" y="345" class="lbl">LISTENING</text>
  <text x="640" y="874" class="lbl" text-anchor="middle">THINKING</text>
  <text x="337" y="345" class="lbl" text-anchor="end">SPEAKING</text>

  <rect x="300" y="506" width="108" height="26" fill="#FFFFFF"/>
  <text x="354" y="525" class="lbl" text-anchor="middle">IDLE</text>

  <!-- ═══ phase-boundary triggers ═════════════════════════════════ -->
  <text x="766" y="597" class="tiny" text-anchor="middle">END OF SPEECH</text>
  <text x="514" y="597" class="tiny" text-anchor="middle">REPLY READY</text>
  <text x="640" y="380" class="tiny" text-anchor="middle">TURN COMPLETE</text>

  <!-- ═══ state schedule ══════════════════════════════════════════ -->
  <g>
    <line x1="1090" y1="210" x2="1504" y2="210" class="rule"/>
    <text x="1090" y="234" class="tbold">STATE SCHEDULE</text>
    <line x1="1090" y1="252" x2="1504" y2="252" class="rule"/>

    <g class="thin"><line x1="1100" y1="288" x2="1140" y2="288"/><line x1="1100" y1="296" x2="1140" y2="296"/></g>
    <text x="1156" y="298" class="lbl">IDLE</text>
    <text x="1156" y="324" class="sub">MICROPHONE OPEN. NOTHING IS</text>
    <text x="1156" y="346" class="sub">TRANSCRIBED AND NOTHING KEPT.</text>
    <line x1="1090" y1="370" x2="1504" y2="370" class="hair"/>

    <line x1="1100" y1="404" x2="1140" y2="404" class="phase"/>
    <text x="1156" y="410" class="lbl">LISTENING</text>
    <text x="1156" y="436" class="sub">UTTERANCE CAPTURED UNTIL THE</text>
    <text x="1156" y="458" class="sub">ENDPOINTER CONFIRMS THE END.</text>
    <line x1="1090" y1="482" x2="1504" y2="482" class="hair"/>

    <line x1="1100" y1="516" x2="1140" y2="516" class="phase"/>
    <text x="1156" y="522" class="lbl">THINKING</text>
    <text x="1156" y="548" class="sub">TRANSCRIPTION, IDENTITY, RECALL</text>
    <text x="1156" y="570" class="sub">AND GENERATION, IN PARALLEL.</text>
    <line x1="1090" y1="594" x2="1504" y2="594" class="hair"/>

    <line x1="1100" y1="628" x2="1140" y2="628" class="phase"/>
    <text x="1156" y="634" class="lbl">SPEAKING</text>
    <text x="1156" y="660" class="sub">SYNTHESIS AND PLAYBACK, STREAMED</text>
    <text x="1156" y="682" class="sub">SENTENCE BY SENTENCE.</text>
    <line x1="1090" y1="706" x2="1504" y2="706" class="rule"/>

    <text x="1090" y="742" class="acclb">THE WAKE WORD IS NEEDED ONCE.</text>
    <text x="1090" y="764" class="acclb">TURNS THEN REPEAT WITHOUT IT.</text>
  </g>

  <!-- ═══ legend ══════════════════════════════════════════════════ -->
  <line x1="96" y1="884" x2="556" y2="884" class="rule"/>
  <text x="96" y="906" class="tbold">LEGEND</text>
  <g>
    <line x1="100" y1="936" x2="160" y2="936" class="phase"/>
    <text x="180" y="941" class="sub">CONVERSATION PHASE</text>
    <g class="thin"><line x1="100" y1="968" x2="160" y2="968"/><line x1="100" y1="976" x2="160" y2="976"/></g>
    <text x="180" y="977" class="sub">IDLE BAND · WAKE-WORD WATCH</text>
    <g class="gate"><line x1="100" y1="1004" x2="160" y2="1004"/><line x1="100" y1="1012" x2="160" y2="1012"/></g>
    <text x="180" y="1013" class="sub">GATE ACROSS THE IDLE BOUNDARY</text>
  </g>

  <!-- ═══ title block ═════════════════════════════════════════════ -->
  <g>
    <rect x="1104" y="884" width="460" height="160" class="rule"/>
    <line x1="1104" y1="928" x2="1564" y2="928" class="rule"/>
    <line x1="1104" y1="986" x2="1564" y2="986" class="rule"/>
    <line x1="1104" y1="1015" x2="1564" y2="1015" class="rule"/>
    <line x1="1360" y1="986" x2="1360" y2="1044" class="rule"/>

    <text x="1120" y="915" class="tbold">ZEROBIONIC</text>
    <text x="1548" y="915" class="sub" text-anchor="end">ASSISTIVE ROBOTICS</text>

    <text x="1120" y="951" class="tiny">TITLE</text>
    <text x="1120" y="974" class="lbl">CONVERSATION STATE CYCLE</text>

    <text x="1120" y="1006" class="sub">DOC ZBR-AF1-SW-001</text>
    <text x="1376" y="1006" class="sub">FIGURE 2</text>
    <text x="1120" y="1035" class="sub">REV 0.1</text>
    <text x="1376" y="1035" class="sub">SHEET 1 OF 1</text>
  </g>
</svg>
