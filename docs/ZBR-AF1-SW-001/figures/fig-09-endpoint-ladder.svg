<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <style>
    .ink   { fill:none; stroke:#25231B; stroke-width:2;   stroke-linejoin:round; stroke-linecap:round; }
    .thin  { fill:none; stroke:#25231B; stroke-width:1.2; stroke-linejoin:round; stroke-linecap:round; }
    .hair  { fill:none; stroke:#8A8172; stroke-width:1;   stroke-linejoin:round; stroke-linecap:round; }
    .grid  { fill:none; stroke:#E4DFD6; stroke-width:1; }
    .dash  { fill:none; stroke:#8A8172; stroke-width:1.3; stroke-dasharray:7 6; }
    .accd  { fill:none; stroke:#D6480C; stroke-width:1.4; stroke-dasharray:6 5; }
    .sheet { fill:none; stroke:#25231B; stroke-width:1.6; }
    .rule  { fill:none; stroke:#17150E; stroke-width:1.2; }
    .acc   { fill:none; stroke:#D6480C; stroke-width:2.4; stroke-linecap:round; }
    .barI  { fill:#25231B; stroke:none; }
    .barA  { fill:#D6480C; stroke:none; }
    .band  { fill:#EFEBE4; stroke:none; }
    .bandA { fill:#FBE7DC; stroke:none; }
    .lbl   { font-family:"Courier New",monospace; font-size:16px; letter-spacing:1.8px; fill:#25231B; }
    .row   { font-family:"Courier New",monospace; font-size:13px; letter-spacing:1.2px; fill:#25231B; }
    .sub   { font-family:"Courier New",monospace; font-size:12.5px; letter-spacing:1.2px; fill:#8A8172; }
    .tiny  { font-family:"Courier New",monospace; font-size:10.5px; letter-spacing:1.0px; fill:#8A8172; }
    .acclb { font-family:"Courier New",monospace; font-size:12px;  letter-spacing:1.4px; fill:#D6480C; }
    .tbold { font-family:"Courier New",monospace; font-size:14px;  letter-spacing:1.6px; fill:#17150E; font-weight:bold; }
  </style>
  <rect width="1600" height="1080" fill="#FFFFFF"/>
  <rect x="36" y="36" width="1528" height="1008" class="sheet"/>

  <g class="hair">
    <line x1="36" y1="96" x2="76" y2="96"/><line x1="96" y1="36" x2="96" y2="76"/>
    <line x1="1524" y1="96" x2="1564" y2="96"/><line x1="1504" y1="36" x2="1504" y2="76"/>
    <line x1="36" y1="984" x2="76" y2="984"/><line x1="96" y1="1004" x2="96" y2="1044"/>
    <line x1="1524" y1="984" x2="1564" y2="984"/><line x1="1504" y1="1004" x2="1504" y2="1044"/>
  </g>

  <text x="130" y="180" class="row">TRAILING SILENCE AFTER THE LAST SPEECH FRAME</text>
  <text x="130" y="202" class="tiny">ALL VALUES AS SHIPPED IN config.yaml</text>
  <text x="410" y="275" class="row" text-anchor="end">SPECULATION FIRES</text>
  <text x="410" y="294" class="tiny" text-anchor="end">hard-coded 180 ms</text>
  <line x1="430" y1="270" x2="1420" y2="270" class="grid"/>
  <rect x="430.0" y="262" width="148.5" height="16" rx="2" class="barA"/>
  <circle cx="578.5" cy="270" r="6" class="thin" fill="#FFFFFF"/>
  <text x="594.5" y="275" class="tiny">180 ms</text>
  <text x="410" y="367" class="row" text-anchor="end">NORMAL ENDPOINT</text>
  <text x="410" y="386" class="tiny" text-anchor="end">vad.silence_ms 450</text>
  <line x1="430" y1="362" x2="1420" y2="362" class="grid"/>
  <rect x="430.0" y="354" width="371.2" height="16" rx="2" class="barI"/>
  <circle cx="801.2" cy="362" r="6" class="thin" fill="#FFFFFF"/>
  <text x="817.2" y="367" class="tiny">450 ms</text>
  <text x="410" y="459" class="row" text-anchor="end">SHORT UTTERANCE</text>
  <text x="410" y="478" class="tiny" text-anchor="end">min_speech_for_fast_end_ms 600 doubles the wait</text>
  <line x1="430" y1="454" x2="1420" y2="454" class="grid"/>
  <rect x="801.2" y="446" width="371.2" height="16" rx="2" class="barI"/>
  <circle cx="1172.5" cy="454" r="6" class="thin" fill="#FFFFFF"/>
  <text x="1188.5" y="459" class="tiny">900 ms</text>
  <text x="410" y="551" class="row" text-anchor="end">HOLD = TRUE</text>
  <text x="410" y="570" class="tiny" text-anchor="end">mid-thought: one more silence window</text>
  <line x1="430" y1="546" x2="1420" y2="546" class="grid"/>
  <rect x="801.2" y="538" width="371.2" height="16" rx="2" class="barA"/>
  <circle cx="1172.5" cy="546" r="6" class="thin" fill="#FFFFFF"/>
  <text x="1188.5" y="551" class="tiny">900 ms</text>
  <text x="410" y="643" class="row" text-anchor="end">HOLD = NONE</text>
  <text x="410" y="662" class="tiny" text-anchor="end">semantic_hold_wait_ms 600, bounded</text>
  <line x1="430" y1="638" x2="1420" y2="638" class="grid"/>
  <rect x="801.2" y="630" width="495.0" height="16" rx="2" class="barA"/>
  <circle cx="1296.2" cy="638" r="6" class="thin" fill="#FFFFFF"/>
  <text x="1312.2" y="643" class="tiny">1050 ms</text>
  <line x1="430" y1="690" x2="1420" y2="690" class="thin"/>
  <line x1="430.0" y1="690" x2="430.0" y2="700" class="hair"/>
  <text x="430.0" y="718" class="tiny" text-anchor="middle">0 ms</text>
  <line x1="512.5" y1="690" x2="512.5" y2="696" class="hair"/>
  <line x1="595.0" y1="690" x2="595.0" y2="696" class="hair"/>
  <line x1="677.5" y1="690" x2="677.5" y2="700" class="hair"/>
  <text x="677.5" y="718" class="tiny" text-anchor="middle">300 ms</text>
  <line x1="760.0" y1="690" x2="760.0" y2="696" class="hair"/>
  <line x1="842.5" y1="690" x2="842.5" y2="696" class="hair"/>
  <line x1="925.0" y1="690" x2="925.0" y2="700" class="hair"/>
  <text x="925.0" y="718" class="tiny" text-anchor="middle">600 ms</text>
  <line x1="1007.5" y1="690" x2="1007.5" y2="696" class="hair"/>
  <line x1="1090.0" y1="690" x2="1090.0" y2="696" class="hair"/>
  <line x1="1172.5" y1="690" x2="1172.5" y2="700" class="hair"/>
  <text x="1172.5" y="718" class="tiny" text-anchor="middle">900 ms</text>
  <line x1="1255.0" y1="690" x2="1255.0" y2="696" class="hair"/>
  <line x1="1337.5" y1="690" x2="1337.5" y2="696" class="hair"/>
  <line x1="1420.0" y1="690" x2="1420.0" y2="700" class="hair"/>
  <text x="1420.0" y="718" class="tiny" text-anchor="middle">1200 ms</text>
  <line x1="801.2" y1="250" x2="801.2" y2="690" class="accd"/>
  <line x1="1172.5" y1="250" x2="1172.5" y2="690" class="accd"/>
  <line x1="1296.2" y1="250" x2="1296.2" y2="690" class="accd"/>
  <text x="130" y="780" class="acclb">THE HOLD IS THE ONLY RULE THAT CAN EXTEND THE WAIT, AND IT IS BOUNDED.</text>
  <text x="130" y="802" class="tiny">WITHOUT THE BOUND, THE MID-THOUGHT CHECK RACED THE TRANSCRIPTION IT DEPENDS ON AND HALF-SENTENCES WERE SHIPPED.</text>
  <line x1="96" y1="884" x2="1040" y2="884" class="rule"/>
  <text x="96" y="906" class="tbold">LEGEND</text>
  <rect x="100" y="935" width="60" height="14" class="barI"/>
  <text x="180" y="947" class="sub">RULE ACTIVE, DECISION NOT YET DUE</text>
  <rect x="100" y="971" width="60" height="14" class="barA"/>
  <text x="180" y="983" class="sub">SPECULATION OR HOLD WINDOW</text>
  <line x1="100" y1="1014" x2="160" y2="1014" class="accd"/>
  <text x="180" y="1019" class="sub">A DECISION THRESHOLD</text>

  <g>
    <rect x="1104" y="884" width="460" height="160" class="rule"/>
    <line x1="1104" y1="928" x2="1564" y2="928" class="rule"/>
    <line x1="1104" y1="986" x2="1564" y2="986" class="rule"/>
    <line x1="1104" y1="1015" x2="1564" y2="1015" class="rule"/>
    <line x1="1360" y1="986" x2="1360" y2="1044" class="rule"/>
    <text x="1120" y="915" class="tbold">ZEROBIONIC</text>
    <text x="1548" y="915" class="sub" text-anchor="end">ASSISTIVE ROBOTICS</text>
    <text x="1120" y="951" class="tiny">TITLE</text>
    <text x="1120" y="974" class="lbl">ENDPOINT DECISION LADDER</text>
    <text x="1120" y="1006" class="sub">DOC ZBR-AF1-SW-001</text>
    <text x="1376" y="1006" class="sub">FIGURE 9</text>
    <text x="1120" y="1035" class="sub">REV 0.1</text>
    <text x="1376" y="1035" class="sub">SHEET 1 OF 1</text>
  </g>
</svg>
