    <g class="hair">
      <line x1="1070" y1="316" x2="1070" y2="408"/><line x1="1082" y1="316" x2="1082" y2="408"/>
      <line x1="1094" y1="316" x2="1094" y2="408"/><line x1="1106" y1="316" x2="1106" y2="408"/>
      <line x1="1118" y1="316" x2="1118" y2="408"/><line x1="1130" y1="316" x2="1130" y2="408"/>
      <line x1="1142" y1="316" x2="1142" y2="408"/><line x1="1154" y1="316" x2="1154" y2="408"/>
