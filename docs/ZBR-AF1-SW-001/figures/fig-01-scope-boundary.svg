        <line x1="0" y1="-10" x2="0" y2="-36" transform="rotate(45)"/>
        <line x1="0" y1="-10" x2="0" y2="-36" transform="rotate(90)"/>
        <line x1="0" y1="-10" x2="0" y2="-36" transform="rotate(135)"/>
        <line x1="0" y1="-10" x2="0" y2="-36" transform="rotate(180)"/>
        <line x1="0" y1="-10" x2="0" y2="-36" transform="rotate(225)"/>
        <line x1="0" y1="-10" x2="0" y2="-36" transform="rotate(270)"/>
        <line x1="0" y1="-10" x2="0" y2="-36" transform="rotate(315)"/>
      </g>
