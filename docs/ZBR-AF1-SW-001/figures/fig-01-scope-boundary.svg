    <g transform="translate(1216,499)">
      <circle r="36" class="thin"/><circle r="10" class="thin"/>
      <g class="hair">
        <line x1="0" y1="-10" x2="0" y2="-36"/>
        <line x1="0" y1="-10" x2="0" y2="-36" transform="rotate(45)"/>
        <line x1="0" y1="-10" x2="0" y2="-36" transform="rotate(90)"/>
        <line x1="0" y1="-10" x2="0" y2="-36" transform="rotate(135)"/>
        <line x1="0" y1="-10" x2="0" y2="-36" transform="rotate(180)"/>
        <line x1="0" y1="-10" x2="0" y2="-36" transform="rotate(225)"/>
        <line x1="0" y1="-10" x2="0" y2="-36" transform="rotate(270)"/>
        <line x1="0" y1="-10" x2="0" y2="-36" transform="rotate(315)"/>
      </g>
    </g>
    <rect x="1288" y="470" width="146" height="60" rx="3" class="thin"/>
    <g class="hair">
      <line x1="1300" y1="480" x2="1300" y2="520"/><line x1="1312" y1="480" x2="1312" y2="520"/>
      <line x1="1324" y1="480" x2="1324" y2="520"/><line x1="1336" y1="480" x2="1336" y2="520"/>
      <line x1="1348" y1="480" x2="1348" y2="520"/><line x1="1360" y1="480" x2="1360" y2="520"/>
      <line x1="1372" y1="480" x2="1372" y2="520"/><line x1="1384" y1="480" x2="1384" y2="520"/>
      <line x1="1396" y1="480" x2="1396" y2="520"/><line x1="1408" y1="480" x2="1408" y2="520"/>
      <line x1="1420" y1="480" x2="1420" y2="520"/>
    </g>

    <text x="1010" y="626" class="lbl">GPU NODE</text>
    <text x="1010" y="650" class="sub">MODEL SERVERS OVER ONE TUNNEL</text>
    <text x="1010" y="672" class="sub">WHISPER · ORPHEUS · DEPTH · VLM · LLM</text>
  </g>

  <!-- ═══ the tunnel, drawn as cable ══════════════════════════════ -->
  <path d="M 690 310 C 800 310, 840 480, 986 480" class="cablo"/>
  <path d="M 690 310 C 800 310, 840 480, 986 480" class="cabli"/>
