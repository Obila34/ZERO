<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080">
  <style>
    .ink   { fill:none; stroke:#25231B; stroke-width:2;   stroke-linejoin:round; stroke-linecap:round; }
    .thin  { fill:none; stroke:#25231B; stroke-width:1.2; stroke-linejoin:round; stroke-linecap:round; }
    .hair  { fill:none; stroke:#8A8172; stroke-width:1;   stroke-linejoin:round; stroke-linecap:round; }
    .bound { fill:none; stroke:#8A8172; stroke-width:1.2; stroke-dasharray:8 8; }
    .sheet { fill:none; stroke:#25231B; stroke-width:1.6; }
    .rule  { fill:none; stroke:#17150E; stroke-width:1.2; }
    .cablo { fill:none; stroke:#D6480C; stroke-width:11; stroke-linecap:round; }
    .cabli { fill:none; stroke:#FFFFFF; stroke-width:6.5; stroke-linecap:round; }
    .shell { fill:#FFFFFF; stroke:#D6480C; stroke-width:2; }
    .lbl   { font-family:"Courier New",monospace; font-size:16px; letter-spacing:1.8px; fill:#25231B; }
    .sub   { font-family:"Courier New",monospace; font-size:12.5px; letter-spacing:1.4px; fill:#8A8172; }
    .tiny  { font-family:"Courier New",monospace; font-size:11px;  letter-spacing:1.2px; fill:#8A8172; }
    .acclb { font-family:"Courier New",monospace; font-size:13px;  letter-spacing:1.6px; fill:#D6480C; }
    .tbold { font-family:"Courier New",monospace; font-size:14px;  letter-spacing:1.6px; fill:#17150E; font-weight:bold; }
    .ghost { opacity:0.30; }
  </style>

  <rect width="1600" height="1080" fill="#FFFFFF"/>

  <!-- ═══ drawing sheet ═══════════════════════════════════════════ -->
  <rect x="36" y="36" width="1528" height="1008" class="sheet"/>
  <g class="hair">
    <line x1="36" y1="96" x2="76" y2="96"/><line x1="96" y1="36" x2="96" y2="76"/>
    <line x1="1524" y1="96" x2="1564" y2="96"/><line x1="1504" y1="36" x2="1504" y2="76"/>
    <line x1="36" y1="984" x2="76" y2="984"/><line x1="96" y1="1004" x2="96" y2="1044"/>
    <line x1="1524" y1="984" x2="1564" y2="984"/><line x1="1504" y1="1004" x2="1504" y2="1044"/>
  </g>

  <!-- ═══ scope boundary ══════════════════════════════════════════ -->
  <rect x="96" y="150" width="1408" height="550" rx="4" class="bound"/>
  <rect x="118" y="137" width="330" height="26" fill="#FFFFFF"/>
  <text x="128" y="156" class="acclb">IN SCOPE · ZBR-AF1-SW-001</text>

  <!-- ═══ RASPBERRY PI 5 · top view ═══════════════════════════════ -->
  <g>
    <rect x="170" y="270" width="440" height="292" rx="14" class="ink"/>
    <rect x="182" y="282" width="416" height="268" rx="8" class="hair"/>

    <g class="thin">
      <circle cx="200" cy="300" r="8"/><circle cx="200" cy="300" r="3.5"/>
      <circle cx="580" cy="300" r="8"/><circle cx="580" cy="300" r="3.5"/>
      <circle cx="200" cy="532" r="8"/><circle cx="200" cy="532" r="3.5"/>
      <circle cx="580" cy="532" r="8"/><circle cx="580" cy="532" r="3.5"/>
    </g>

    <!-- 40-pin GPIO header -->
    <rect x="226" y="288" width="300" height="32" rx="2" class="thin"/>
    <line x1="226" y1="304" x2="526" y2="304" class="hair"/>
    <g class="hair">
      <line x1="241" y1="292" x2="241" y2="316"/><line x1="256" y1="292" x2="256" y2="316"/>
      <line x1="271" y1="292" x2="271" y2="316"/><line x1="286" y1="292" x2="286" y2="316"/>
      <line x1="301" y1="292" x2="301" y2="316"/><line x1="316" y1="292" x2="316" y2="316"/>
      <line x1="331" y1="292" x2="331" y2="316"/><line x1="346" y1="292" x2="346" y2="316"/>
      <line x1="361" y1="292" x2="361" y2="316"/><line x1="376" y1="292" x2="376" y2="316"/>
      <line x1="391" y1="292" x2="391" y2="316"/><line x1="406" y1="292" x2="406" y2="316"/>
      <line x1="421" y1="292" x2="421" y2="316"/><line x1="436" y1="292" x2="436" y2="316"/>
      <line x1="451" y1="292" x2="451" y2="316"/><line x1="466" y1="292" x2="466" y2="316"/>
      <line x1="481" y1="292" x2="481" y2="316"/><line x1="496" y1="292" x2="496" y2="316"/>
      <line x1="511" y1="292" x2="511" y2="316"/>
