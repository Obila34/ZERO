      <circle cx="22" cy="4" r="4" class="thin"/>
    </g>
    <text x="256" y="782" class="lbl">MOTION STACK</text>
    <text x="256" y="806" class="tiny">ARMS · BALANCE · GAIT</text>

    <!-- chest compute -->
    <rect x="510" y="740" width="300" height="92" rx="4" class="thin"/>
    <g transform="translate(546,786)">
      <rect x="-20" y="-16" width="40" height="32" rx="3" class="ink"/>
      <line x1="-14" y1="-10" x2="14" y2="-10" class="hair"/>
      <rect x="-8" y="-2" width="16" height="12" rx="1" class="hair"/>
    </g>
    <text x="596" y="782" class="lbl">CHEST PI 4B</text>
    <text x="596" y="806" class="tiny">NANO 1 · NANO 2</text>

    <!-- application -->
    <rect x="850" y="740" width="300" height="92" rx="4" class="thin"/>
    <g transform="translate(886,786)">
      <rect x="-20" y="-16" width="40" height="32" rx="3" class="ink"/>
      <line x1="-20" y1="-6" x2="20" y2="-6" class="thin"/>
      <circle cx="-14" cy="-11" r="2" class="hair"/>
      <circle cx="-7" cy="-11" r="2" class="hair"/>
    </g>
    <text x="936" y="782" class="lbl">AF-1 APPLICATION</text>
    <text x="936" y="806" class="tiny">UI · VOICE PICKER</text>

    <!-- power / thermal -->
    <rect x="1190" y="740" width="280" height="92" rx="4" class="thin"/>
    <g transform="translate(1226,786)">
      <rect x="-20" y="-12" width="34" height="24" rx="3" class="ink"/>
      <rect x="14" y="-5" width="6" height="10" rx="1" class="thin"/>
      <line x1="-12" y1="-4" x2="-12" y2="4" class="hair"/>
      <line x1="-4" y1="-4" x2="-4" y2="4" class="hair"/>
      <line x1="4" y1="-4" x2="4" y2="4" class="hair"/>
    </g>
    <text x="1276" y="782" class="lbl">POWER · THERMAL</text>
    <text x="1276" y="806" class="tiny">MECHANICAL · TEARDOWN</text>
  </g>

  <!-- ═══ legend ══════════════════════════════════════════════════ -->
  <line x1="96" y1="884" x2="556" y2="884" class="rule"/>
  <text x="96" y="906" class="tbold">LEGEND</text>
  <g>
    <line x1="100" y1="936" x2="160" y2="936" class="ink"/>
    <text x="180" y="941" class="sub">IN SCOPE · SPECIFIED IN THIS DOCUMENT</text>
    <g class="ghost"><line x1="100" y1="972" x2="160" y2="972" class="ink"/></g>
    <text x="180" y="977" class="sub">OUT OF SCOPE · SEE OWNING DOCUMENT</text>
    <path d="M 100 1008 L 160 1008" class="cablo"/>
    <path d="M 100 1008 L 160 1008" class="cabli"/>
    <text x="180" y="1013" class="sub">INTERFACE OWNED BY THIS DOCUMENT</text>
  </g>

  <!-- ═══ title block ═════════════════════════════════════════════ -->
  <g>
    <rect x="1104" y="884" width="460" height="160" class="rule"/>
    <line x1="1104" y1="928" x2="1564" y2="928" class="rule"/>
    <line x1="1104" y1="986" x2="1564" y2="986" class="rule"/>
    <line x1="1104" y1="1015" x2="1564" y2="1015" class="rule"/>
    <line x1="1360" y1="986" x2="1360" y2="1044" class="rule"/>

    <text x="1120" y="915" class="tbold">ZEROBIONIC</text>
    <text x="1548" y="915" class="sub" text-anchor="end">ASSISTIVE ROBOTICS</text>

    <text x="1120" y="951" class="tiny">TITLE</text>
    <text x="1120" y="974" class="lbl">ZERO SCOPE BOUNDARY</text>

    <text x="1120" y="1006" class="sub">DOC ZBR-AF1-SW-001</text>
    <text x="1376" y="1006" class="sub">FIGURE 1</text>
    <text x="1120" y="1035" class="sub">REV 0.1</text>
    <text x="1376" y="1035" class="sub">SHEET 1 OF 1</text>
  </g>
</svg>
