    <rect x="470" y="436" width="22" height="15" rx="2" class="hair"/>
    <g class="hair">
      <circle cx="478" cy="470" r="4"/><circle cx="492" cy="470" r="4"/><circle cx="506" cy="470" r="4"/>
    </g>
    <!-- power button -->
    <circle cx="596" cy="330" r="7" class="thin"/>

    <!-- right-edge port stack -->
    <rect x="610" y="286" width="58" height="48" rx="3" class="ink"/>
    <line x1="624" y1="286" x2="624" y2="334" class="hair"/>
    <rect x="610" y="352" width="58" height="42" rx="3" class="ink"/>
    <line x1="610" y1="373" x2="668" y2="373" class="hair"/>
    <rect x="610" y="410" width="58" height="42" rx="3" class="ink"/>
    <line x1="610" y1="431" x2="668" y2="431" class="hair"/>

