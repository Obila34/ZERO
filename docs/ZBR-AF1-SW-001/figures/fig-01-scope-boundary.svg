  <rect x="982" y="466" width="30" height="28" rx="3" class="shell"/>
  <rect x="700" y="196" width="330" height="26" fill="#FFFFFF"/>
  <text x="706" y="215" class="acclb">SSH TUNNEL · SINGLE HOP</text>

