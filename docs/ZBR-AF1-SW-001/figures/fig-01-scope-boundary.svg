    <rect x="268" y="362" width="94" height="94" rx="3" class="ink"/>
    <rect x="282" y="376" width="66" height="66" rx="2" class="thin"/>
    <circle cx="276" cy="370" r="3" class="hair"/>

    <!-- LPDDR4X -->
    <rect x="382" y="362" width="74" height="52" rx="3" class="thin"/>
    <!-- RP1 southbridge -->
    <rect x="382" y="430" width="54" height="54" rx="3" class="thin"/>
    <!-- power management -->
    <rect x="470" y="362" width="46" height="34" rx="3" class="hair"/>
    <!-- PCIe FPC -->
    <rect x="536" y="356" width="18" height="80" rx="2" class="thin"/>
    <!-- CSI / DSI FPC on left edge -->
    <rect x="188" y="352" width="16" height="66" rx="2" class="thin"/>
    <rect x="188" y="432" width="16" height="66" rx="2" class="thin"/>
