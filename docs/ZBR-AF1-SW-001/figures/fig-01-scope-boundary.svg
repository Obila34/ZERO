    <rect x="170" y="740" width="300" height="92" rx="4" class="thin"/>
    <g transform="translate(206,786)">
      <line x1="-16" y1="16" x2="0" y2="-8" class="ink"/>
      <line x1="0" y1="-8" x2="22" y2="4" class="ink"/>
      <circle cx="0" cy="-8" r="6" class="thin"/>
