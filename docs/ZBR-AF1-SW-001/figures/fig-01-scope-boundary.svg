        <line x1="0" y1="-12" x2="0" y2="-46"/>
        <line x1="0" y1="-12" x2="0" y2="-46" transform="rotate(45)"/>
        <line x1="0" y1="-12" x2="0" y2="-46" transform="rotate(90)"/>
