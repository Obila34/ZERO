    <rect x="226" y="562" width="38" height="16" rx="2" class="thin"/>
    <rect x="292" y="562" width="30" height="16" rx="2" class="thin"/>
    <rect x="346" y="562" width="30" height="16" rx="2" class="thin"/>

    <text x="170" y="626" class="lbl">RASPBERRY PI 5</text>
    <text x="170" y="650" class="sub">AF-1 HEAD · SINGLE PYTHON PROCESS</text>
    <text x="170" y="672" class="sub">WAKE · ENDPOINT · LOOP · DETECT · PLAYBACK</text>
  </g>

  <!-- ═══ GPU NODE · top view ═════════════════════════════════════ -->
  <g>
    <rect x="1010" y="265" width="460" height="300" rx="10" class="ink"/>
    <rect x="1022" y="277" width="436" height="276" rx="6" class="hair"/>

    <g class="thin">
      <circle cx="1040" cy="295" r="8"/><circle cx="1040" cy="295" r="3.5"/>
      <circle cx="1440" cy="295" r="8"/><circle cx="1440" cy="295" r="3.5"/>
      <circle cx="1040" cy="535" r="8"/><circle cx="1040" cy="535" r="3.5"/>
      <circle cx="1440" cy="535" r="8"/><circle cx="1440" cy="535" r="3.5"/>
    </g>

    <!-- CPU socket + tower heatsink -->
