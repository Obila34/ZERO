# ZERO configuration — every engine is selectable here so the pipeline never
# needs a code change to swap a stage (local today, cloud later).

audio:
  sample_rate: 16000 # 16 kHz mono everywhere in the pipeline
  block_ms: 30 # frame size for capture / VAD
  input_device: pipewire
    # 0 input channels until the mic is unmuted at
    # the ALSA layer (alsamixer -c 3, F4=capture).
  input_gain:
    6.0 # MIDDLE ground. 16.0 clipped this card-3 mic (peak
    # 32767); 1.0 was too quiet for the wake word / VAD to
    # fire. 6.0 lifts normal speech to a healthy level
    # without clipping. Tune from the "utterance: rms="
    # logs: aim rms ~2000-6000, peak well under 32767.
  output_device:
    pipewire # routes to PipeWire's default sink = the BT speaker
    # (needs the pipewire-alsa package). Use Headphones for 3.5mm jack.

  # Acoustic echo cancellation (speex): subtract ZERO's own playback from the
  # mic so barge-in hears YOU, not its echo. Needs `pip install speexdsp`
  # (apt install libspeexdsp-dev first). Works with WIRED output (stable
  # delay); leave OFF for Bluetooth (drifting latency defeats the filter).
  aec:
    enabled: false
    filter_ms: 200 # echo tail the filter can absorb (raise for a live room)

privacy:
  # Bystander handling for voices ZERO does not recognise:
  #   open    = answered and remembered (single-user household)
  #   guarded = answered, but nothing they say is stored long-term  <- default
  #   strict  = unknown voices are not engaged at all
  # Known (enrolled) people always get full service. Erasure is always
  # honoured: "forget that", "forget everything about me".
  bystander_mode: guarded
  indicator_gpio_pin: # LED pin for the visible "I'm listening" signal
    # (e.g. 17). Blank = log-only indicator.

control:
  # The AF1 fusion surface (zero/control.py) — an HTTP control plane inside the
  # ZERO process so the AF1 cockpit can push a talk turn / a spoken line / a
  # status probe at the SAME brain the mic loop runs. LAN-only by design: it
  # rides the zero.service unit, no extra daemon, no terminal.
  enabled: true
  host: 0.0.0.0 # listen on the LAN (AF1 reaches the Pi at 192.168.150.202)
  port: 8090
  person_id: 1 # memory owner for AF1 turns (AF1 is the logged-in operator)

conversation:
  # After waking once, ZERO stays in a flowing conversation (no wake word between
  # turns). It sleeps after this much continuous silence, or on a stop phrase.
  sleep_timeout_ms: 30000

  # Reply in the language spoken to: Swahili / English code-switching flows
  # naturally (persona-level; pairs with stt.language below).
  multilingual: true

  # Barge-in: while ZERO is speaking, the mic stays live — say the wake word OR
  # just talk over it to cut the reply off. Speech barge-in is echo-aware: it
  # learns the reply's own echo level first, then triggers on sustained speech
  # well above it, and the interrupting words are fed straight into the next
  # turn (no need to repeat yourself). Set false to disable all barge-in.
  barge_in: true
  barge_in_on_speech: true # false = wake-word-only interruption
  barge_in_learn_ms: 900 # echo-floor learning window at reply start
  barge_in_speech_ms: 300 # sustained speech needed to trigger the interrupt
  barge_in_ratio:
    1.6 # foreground must be this x louder than the echo floor. At normal
    # speaking levels (rms ~500-850 at gain 6) 2.0 made interruption
    # impossible whenever the reply echo topped ~400 rms. Watch the
    # "barge-in armed: ... speech gate" log line: your voice must beat
    # the gate. Self-triggers = raise; never triggers = lower.
  barge_in_min_rms: 250 # absolute int16 RMS floor for foreground speech

  # Tiny neutral backchannel that fits ANY input (a committal "let me think" on a
  # casual "how are you" breaks the illusion). Played only sometimes, and only if
  # the real reply's audio hasn't already arrived within the grace window — a
  # fast answer is never delayed by a filler.
  filler_probability: 0.25
  filler_grace_ms: 600
  fillers:
    question: ["Mm.", "Okay.", "Hmm."]
    default: ["Mm.", "Right.", "Okay."]
    ack: ["Mm-hmm.", "Sure."]

  # In-session compaction: on a long session, trimmed-away turns are folded into a
  # short rolling summary (off the hot path) instead of being dropped. Context
  # stays bounded — persona + memory + this summary + `llm.history_turns` live
  # turns — so the shared GPU's KV cache stays small however long you talk, and the
  # thread is preserved rather than forgotten.
  compaction:
    enabled: true
    max_summary_chars: 600 # cap on the rolling summary injected into the prompt

memory:
  enabled: true # remember durable facts across sessions (SQLite)
  path: zero_memory.sqlite # single file on disk; survives reboots
  max_facts: 30 # cap injected facts so the prompt stays small/fast
  recent_episodes:
    3 # one-line summaries of recent conversations injected at
    # the start, so ZERO recalls the ARC of past chats (0 = off)
  max_stored_facts: 200 # storage caps (oldest pruned) so the DB never grows
  max_stored_episodes: 100 # forever — injection caps above only limit the prompt

  # Human-like recall: memories are activation-ranked (relevance x recency x
  # importance, Generative-Agents style) instead of dumped wholesale. Semantic
  # relevance needs embeddings; the GPU Ollama provides them over the existing
  # tunnel, with an offline hashing fallback so recall degrades, never breaks.
  embeddings:
    backend: auto # auto (ollama if llm.host set, else hash) | ollama | hash | off
    # A DEDICATED embedding model — a chat model (gemma) can't serve
    # /api/embeddings, which silently degraded recall to hash-matching.
    # One-time setup on the GPU node:  ollama pull nomic-embed-text
    # The model is tiny (~275MB) and pinned resident (keep_alive -1) so embeds
    # never load-churn against the chat model. If the GPU is so tight that both
    # can't stay loaded (watch `ollama ps`), set OLLAMA_MAX_LOADED_MODELS=2 in
    # the Ollama service env — or set backend: hash to take embeds off the GPU.
    ollama_model: nomic-embed-text
    timeout_s: 3.0 # embeds sit near the reply path: fail FAST into hash, never stall
    slow_ms: 800 # embeds consistently slower than this = the GPU has no headroom;
      # auto-degrade to hash for the session (a slow embed also forces
      # the CHAT model to reload — that was the ~6s first-token lag)
    hash_dim: 256 # fallback hashing-embedder dimension
  retrieval:
    top_k: 6 # memories surfaced per recall
    half_life_days: 14 # recency decay half-life
    min_activation: 0.05 # below this a memory doesn't surface at all
    budget_ms: 300 # hard per-turn budget for recall; over-budget = skip the
      # note this turn. Keeps memory OFF the reply's critical path
      # (a slow GPU embed was costing ~6s of first-token latency).
  forgetting:
    enabled: true # gentle decay: old + unimportant + never-recalled
    max_age_days: 90 # ...memories fade after this long untouched

  # Durable "last time we spoke" record, one per person, updated in place and
  # marked protected — exempt from decay, age-out and the episodic cap. When a
  # recognised voice returns (even years later) ZERO greets them with what you
  # last discussed and picks the thread back up. Attribution is by VOICE (see
  # identity.session), so the record belongs to whoever actually spoke.
  last_conversation:
    enabled: true

learning:
  # Few-shot object learning: "this is a french press" binds the current
  # object crop's embedding to the name — no retraining, grows past COCO-80.
  objects:
    enabled: true
    db_path: zero_objects.sqlite
    clip_model_path: # optional CLIP image-encoder ONNX; blank = the
      # offline histogram embedder (color+shape)
    match_threshold: 0.80 # cosine needed to override a detector label (local hist)
    match_threshold_clip: 0.72 # threshold when the remote CLIP embedder is active
    max_samples_per_object: 5
    unknown_conf:
      0.45 # detections below this and unlearned count as
      # "unfamiliar" -> curiosity queue
  # Curiosity: while ALONE, learn silently (consolidate memory, log unknown
  # objects, queue questions); ask when a known person is around. ZERO never
  # talks to an empty room.
  curiosity:
    enabled: true
    db_path: zero_curiosity.sqlite
    max_pending: 20
  # Interaction corpus: every day-to-day conversation is appended (per speaker,
  # as JSONL) as raw material for periodic OFFLINE fine-tunes — how people phrase
  # things, code-switch, accents. Split per speaker (voice-owned), so one
  # person's speech never contaminates another's training data. Gated by privacy:
  # a session ZERO may not remember is one it won't record. Turn into a training
  # set with scripts/export_corpus.py — see docs/TRAINING.md.
  corpus:
    enabled: true
    dir: data/corpus

  # The experience spine (Phase 3): every turn / surprising scene event /
  # proactive attempt becomes ONE reward+surprise-tagged episode row. Nightly
  # consolidation (scripts/consolidate.py + zero-consolidate.timer) distills
  # them into memory and reward-weighted training data, then marks them done.
  episodes:
    enabled: true
    db_path: zero_episodes.sqlite

  # Offline LoRA fine-tune command run by the nightly consolidation on the
  # reward-weighted export (data/train/chat.jsonl). Left null: training needs
  # GPU headroom the shared card doesn't have — see docs/TRAINING.md.
  training:
    cmd: null

perception:
  # ── GPU offload (Phase 8): the Pi is a FRONTEND ────────────────────────────
  # Heavy senses run on the GPU via /perceive/* on the vision server (:8000,
  # the same SSH tunnel): YOLO11x detection, SCRFD+ArcFace faces, ECAPA voice
  # embeddings, CLIP object embeddings. Every stage keeps its local engine as
  # a lazily-built fallback, so a dropped tunnel degrades (smaller local
  # models) instead of blinding ZERO — and recovers per-call.
  remote:
    enabled: true
    base_url: http://127.0.0.1:8000 # vision server through the tunnel
    timeout_s: 5.0 # face/speaker/CLIP calls
    detect_timeout_s: 10.0 # detection (first call loads YOLO11x)
    jpeg_quality: 80

  # Reading HOW things are said. Affect fuses voice prosody + a text valence
  # lexicon (+ facial expression if an FER+ ONNX is configured); only notable,
  # confident reads reach the LLM — as tone guidance, never spoken diagnosis.
  affect:
    enabled: true
    face_model_path: # optional FER+ ONNX (64x64 gray); blank = voice+text only
  # Turn-level diarization: notice when a DIFFERENT person takes over,
  # using the per-utterance voice embeddings identity already computes.
  diarize:
    enabled: true
    change_threshold: 0.40 # consecutive-turn voice cosine below this = new speaker

proactive:
  # ZERO speaking without a wake word — a time-aware greeting when someone
  # appears, a queued curiosity question or an ambient remark when they linger.
  # Still gated hard: cooldowns, a global hourly cap, and quiet hours keep it
  # from being annoying. Timers/reminders the user set always announce.
  enabled: true
  engage_unknown:
    true # greet/engage ANYONE the camera sees, not just
    # enrolled faces. false = known people only.
  quiet_hours: [22, 7] # no proactive speech from 22:00 to 07:00 ([] = off)
  greet_cooldown_s: 14400 # re-greet the same person at most every 4h
  curiosity_cooldown_s: 1800 # at most one curiosity question per 30 min
  remark_cooldown_s: 300 # at most one ambient remark per 5 min
  max_per_hour: 6 # global proactive utterance cap (hard ceiling)
  presence_reset_s: 1200 # away this long -> next arrival greets again
  check_interval_s: 3.0 # idle watcher tick
  linger_s: 45 # person present this long before a question/remark

preferences:
  enabled:
    true # "speak slower" / "keep it short" -> stored as
    # standing behaviour + engine knobs where possible

tools:
  # The hands: real actions routed in three tiers — regex intents (instant),
  # LLM JSON tool calls (flexible), plain chat (everything else). The allow
  # list is the safety boundary: a tool not named here cannot run.
  enabled: true
  allow: [time, timer, reminder, remember, recall, web_search]

  # Live internet access. Points at a search endpoint returning JSON
  # {results:[{title,url,content}]} — a self-hosted SearXNG is the easy private
  # option (docker run searxng/searxng, then use its /search?format=json). The
  # LLM decides when to call it; results are handed back for it to phrase in
  # ZERO's own voice, and if the endpoint is unreachable it says so rather than
  # inventing an answer. Off by default until you have an endpoint reachable.
  websearch:
    enabled: true # SearXNG on the GPU node, reached over the tunnel (:8080)
    url: http://127.0.0.1:8080/search
    timeout_s: 8.0
    max_results: 3

identity:
  # "Who is this?" — multi-person recognition fusing FACE and VOICE embeddings
  # (same embed->cosine->threshold pattern as voiceid, but a registry of people
  # instead of one owner). Enrol conversationally: "I'm David" / "my name is
  # David". Each channel degrades independently: missing face model ->
  # voice-only, missing voice model -> face-only, neither -> anonymous mode.
  enabled: true
  db_path: zero_identity.sqlite
  max_samples_per_kind: 5 # stored embedding samples per person per channel
  reinforce_threshold: 0.70 # confident joint matches refresh stored samples
  # Sessions are owned by VOICE: the speaker's voice decides whose memories a turn
  # belongs to (anonymous when the voice is unsure — see fusion.voice_threshold).
  # The face is perception only — logged and used for the "I can see you" note, but
  # it never decides whose session this is. A different enrolled voice taking over
  # mid-conversation becomes the new owner (live handover, per turn).
  # Provisional identities for people ZERO hasn't been introduced to. Instead of
  # collapsing every stranger into one anonymous bucket, each unfamiliar VOICE is
  # clustered by its embedding into a stable guest (a negative id: guest-1,
  # guest-2, ...). Different strangers — and their training data — stay separate;
  # a guest who later gives a name is enrolled as a real person from then on.
  guests:
    enabled: true
    db_path: zero_guests.sqlite
    match_threshold: 0.55 # voice cosine to treat two utterances as the same guest
    max_guests: 50
    # Quality gates — a turn must prove it's REAL speech before it can mint or
    # match a guest. Whisper hallucinates plausible text from near-silence
    # (subtitle credits, 'Obrigado'), and those were creating phantom guests.
    min_words: 2 # transcript must have at least this many words
    min_ms: 1200 # utterance must be at least this long
    min_rms: 150 # ...and at least this loud (int16 RMS)
  session:
    voice_only: true
    # Durable memory (facts + the per-person last-conversation) is written for a
    # turn only when its voice match clears THIS bar — stricter than the live
    # accept (fusion.voice_threshold), so a borderline turn can't persist into the
    # wrong person's permanent memory. Live conversation still responds at the
    # lower bar; only what gets *saved* is held to the higher one. Turns below it
    # are folded into an anonymous bucket, not mis-credited to a nearby speaker.
    write_min_score: 0.55
  voice:
    model_path: models/voiceid/voxceleb_ECAPA512_LM.onnx # reuses the voiceid model
  face:
    # ArcFace-style ONNX face embedder (512-d), e.g. w600k_r50.onnx from
    # InsightFace buffalo_l. Blank/missing = voice-only identity.
    model_path: models/identity/arcface.onnx
    min_size: 60 # smallest face (px) worth matching
    # Local face detection/alignment tiers (the fallback path when the GPU
    # tunnel is down). YuNet = room-scale detector + 5-point ArcFace alignment
    # (runs on cv2, no extra wheel); MediaPipe FaceLandmarker refines those 5
    # points per face crop (iris-accurate). Missing files or wheels demote
    # tier by tier down to Haar — never an error.
    detector_path: models/face/yunet_2023mar.onnx
    landmarker_path: models/face/face_landmarker.task
  fusion:
    w_face: 0.55 # weights are normalized; face is the steadier signal
    w_voice: 0.45
    threshold: 0.50 # fused (both channels agree) accept
    face_threshold: 0.42 # single-channel accepts are stricter by nature
    voice_threshold: 0.45

voiceid:
  # "Only my voice" — verify each utterance is the enrolled owner before acting.
  # Enroll once on the device:  python test_voiceid.py enroll
  enabled: false # flip to true AFTER you've enrolled + downloaded the model
  model_path: models/voiceid/voxceleb_ECAPA512_LM.onnx
  profile_path: voiceprint.npy
  threshold: 0.45 # owner ~0.55-0.70, others ~0.25-0.35 (tuned on PC)

wake:
  engine: openwakeword
  # openWakeWord ships pretrained words; for a true "Hey Zero" train a custom model.
  # Start with a built-in like "hey_jarvis" to prove the pipeline, then swap.
  model: hey_jarvis
  threshold: 0.5

vad:
  engine:
    ten # ten (TEN VAD, neural, via WebAssembly — sharpest, ~7% of one Pi
    # core) <- chosen | webrtc (energy-based, catches quiet mics, no deps) |
    # silero (ONNX, sharper than webrtc but can miss a quiet mic).
    # All three fall back to webrtc if their model/runtime is missing.
  # TEN VAD runs from its official WebAssembly build (there is NO native
  # ARM64/Linux build — the pip package raises "Unsupported platform" on the
  # Pi). wasm is byte-for-byte identical to native (validated). Needs wasmtime.
  ten_wasm_model: models/vad/ten_vad.wasm
  ten_threshold:
    0.5 # P(speech) per 16 ms frame to count as voice. Raise to reject more
    # background/noise; lower to catch quieter/softer speech.
  silero_model: models/vad/silero_vad.onnx # downloaded by setup_pi.sh
  silero_threshold:
    0.3 # speech-probability to accept (default silero is
    # 0.5; lower = more sensitive, for quiet mics)
  # Audio-first end-of-turn detection (Pipecat Smart Turn v3, ONNX on the CPU).
  # Decides "has the speaker actually finished?" from prosody/rhythm in the
  # waveform at each pause — replacing the text-only ends_mid_thought heuristic,
  # so the endpoint no longer waits on a transcript. none = text heuristic only.
  turn_detector: smart_turn # smart_turn | none
  smart_turn_model: models/turn/smart-turn-v3.2-cpu.onnx
  smart_turn_threshold:
    0.5 # P(turn complete) >= this -> commit; below -> hold as mid-thought.
    # Raise to hold longer (fewer early cut-offs); lower to commit sooner.
  silence_ms: 450 # trailing silence that ends an utterance (adaptive: see below)
  semantic_hold:
    true # endpoint intelligence: the early (speculative) transcript of a
    # pause is checked — if it ends mid-thought ("...and", "...the",
    # a trailing "..."), ZERO waits one extra silence window instead
    # of cutting you off mid-sentence.
  semantic_hold_wait_ms:
    600 # if the speculative transcript hasn't arrived when the endpoint is
    # due, wait up to this long for it instead of racing the STT round
    # trip. The race was why half-sentences got shipped: the "is this
    # finished?" answer landed ~200ms after the endpoint had committed.
    # Finished sentences still commit the moment the transcript says so.
  min_speech_for_fast_end_ms:
    600 # utterances with less speech than this wait DOUBLE the
    # silence before ending — slow starters ("um...") aren't cut
    # off, finished sentences still commit fast. 0 = off.
  aggressiveness: 2 # webrtc 0-3; 2 lets the VAD catch quieter/softer speech
    # (3 was rejecting too much once the gain dropped)
  energy_threshold:
    150 # int16 RMS a single frame must exceed to count as speech.
    # LOW on purpose: the webrtc VAD is the real speech detector,
    # this is just a gentle floor so silence/hum can't start a
    # capture. Was 350 — a wall that dropped real speech.
  min_utterance_rms:
    30 # PROXIMITY GATE: drop a whole utterance quieter than this
    # on average. Kept very LOW: sad/tired people speak quietly,
    # and dropping their words is a human-feel bug. 0 = off.
  max_utterance_ms: 15000 # hard cap so STT input stays bounded
  speech_pad_ms: 200 # keep a little audio either side of speech

stt:
  # GPU offload: send audio to large-v3-turbo on the GPU (Whisper server over the
  # SSH tunnel). Turbo-quality at ~1s, instead of 29s on the Pi CPU.
  engine: remote # remote (GPU turbo) | whispercpp (local)
  remote_url: http://127.0.0.1:9000/transcribe
  remote_timeout: 30
  language:
    auto # blank = server default (en) | sw | auto (Whisper detects —
    # best for English/Swahili code-switching; matches
    # conversation.multilingual above)
  # If the remote fails (tunnel down), fail over to this local engine per-utterance
  # — built lazily on first failure; the remote is retried every turn so quality
  # comes back the moment the tunnel does. Needs the whispercpp model + pywhispercpp
  # installed. Blank = no fallback (failures are logged and the utterance dropped).
  fallback: whispercpp

  # --- local fallback (engine: whispercpp) ---
  # base.en is the CPU sweet spot (~1.5s). large-v3-turbo on the Pi CPU = 29s/clip.
  model: base.en
  model_path: models/whisper/ggml-base.en.bin
  threads: 4 # use all 4 Pi cores during transcription
  audio_ctx: 768 # cap encoder window (0=full/30s). 768 ~halves encode for short turns
  # Biases the decoder toward conversational phrasing, cutting single-phoneme
  # mishears like "what's your aim" -> "what's your name". Keep it short.
  initial_prompt: "A natural spoken conversation with a voice assistant named Zero."

llm:
  engine: ollama
  # GPU offload: host is the SSH tunnel to the GPU's Ollama (Pi:11435 -> node:11434).
  # Gemma4 (8B) runs there at ~100 tok/s. Local fallback: host 127.0.0.1:11434 +
  # model qwen2.5:3b-instruct (needs the Pi's own Ollama running).
  host: http://127.0.0.1:11435
  model: gemma4:latest # 8B on the GPU via tunnel
  temperature:
    0.6 # a playful persona at 0.3 reads flat; the prompt's honesty
    # clauses do the factual guarding, not the temperature
  max_tokens:
    500 # ~1-2 spoken sentences — snappier replies, fewer pauses
    # (caps runaway answers; raise if you want longer ones)
  num_ctx:
    4096 # explicit context size. Big enough for persona + memory +
    # 6 turns, but HALF the KV-cache VRAM of 8192 — the GPU is
    # shared (Gemma + Whisper + Orpheus + YOLO11x + CLIP + faces)
    # and 8192 was tipping it into OOM. Raise only with headroom.
  # Cache-friendly history: append-only most turns (fast ~2s), and only trim back
  # to `history_turns` once it grows past `history_trim_at`.
  history_turns: 6 # size we keep after a trim (3 felt like a goldfish)
  history_trim_at: 12 # let it grow to this many turns before trimming

tts:
  engine: orpheus # orpheus (GPU, natural) | piper (local fallback) | fish
  # If the remote Orpheus fails (tunnel down), speak through local Piper instead of
  # going silently mute — the different voice IS the "degraded mode" signal. Built
  # lazily on first failure; the remote is retried every sentence. Needs the piper
  # binary + voice below. Blank = no fallback.
  fallback: piper
  orpheus:
    # Orpheus TTS server on the GPU node, over an SSH tunnel. Male voices:
    # leo dan zac; female: tara leah jess mia zoe. leo = the most natural,
    # steady male voice. For BEST quality run the fp16 vLLM server
    # (server/orpheus_server.py) instead of the quantized cpp one — same
    # endpoints, higher fidelity, faster streaming (compute permitting).
    url: http://127.0.0.1:9100/tts # Orpheus server on zerolabs1 via SSH tunnel (was S2 shim 100.95.210.94:9100 on zerolabs0)
    voice: leo
    timeout: 30
    # Jitter buffer: pre-accumulate this much audio before playback starts, so
    # a brief generation hiccup never underruns the speaker mid-word (the
    # stutter). Costs this much added latency to first sound — cheap insurance.
    prebuffer_ms: 300
  piper:
    binary: piper/piper # extracted arm64 release (relative to repo root)
    voice: models/piper/en_US-amy-medium.onnx
    length_scale: 1.0 # base speaking rate (orchestrator nudges per-segment)
  fish:
    # OpenAudio S1-mini — expressive mode. PyTorch/CPU build, NOT the MLX build.
    model_dir: models/fish/openaudio-s1-mini
    precision: int8 # int8 | int4 | fp16  (transformer quantization)
    # codec stays fp16 regardless (GAN — quantizing degrades audio)
    # Inference command, finalized in the Phase-6 spike. Placeholders:
    # {model_dir} {text} {out}. Must write a WAV to {out}. Leave null until set.
    infer_cmd: null

vision:
  # ZERO's eyes. The camera + YOLO11n + color loop runs continuously in the
  # background (perception is never on the critical path); the wake word that
  # starts a conversation makes ZERO *attend* to what it's already seeing.
  enabled:
    true # needs a camera + requirements-vision.txt installed.
    # Off = voice-only (unchanged pipeline).

  # Set true ONLY if llm.model is a vision-capable build (e.g. a multimodal Gemma
  # 3 / Qwen2-VL). Then the keyframe itself is handed to the LLM on visual turns.
  # If false, ZERO still "sees" via detection + GPU depth facts as text — just no
  # raw-image understanding. Verify with: ollama show <model> (look for "vision").
  multimodal: true

  max_items: 6 # most objects named in the detector HINT (counts only)

  # Spontaneous visual remarks: stable scene changes (an object appearing /
  # disappearing for 2s+) surface as a note the LLM MAY mention mid-conversation
  # ("oh, is that new?"). Rate-limited so it never gets chatty.
  change_note_cooldown_s: 120

  # Digital gaze: a moveable attention window that recenters on the tracked
  # face — software pan/tilt, no motors, the room stays in view. Drawn on the
  # preview (orange box + top-right inset). Needs the YuNet face model
  # (identity.face.detector_path); silently off without it.
  attention:
    enabled: true
    window_frac: 0.45 # window size as a fraction of each frame dimension
    confirm_s: 0.4 # face must persist this long before the gaze locks on
    lost_s: 2.0 # gaze holds a briefly-lost face this long (head turns, blinks)

  # Live preview: SEE what ZERO sees (camera feed + detection boxes) while it runs.
  preview: true
  preview_mode:
    auto # auto | window | web
    #  window = an OpenCV desktop window (needs a monitor)
    #  web    = an MJPEG stream in a browser — works on a
    #           HEADLESS Pi: open http://<pi-ip>:8008/
    #  auto   = window if a display is detected, else web
    #           (so it just works on a laptop AND a Pi).
  preview_host:
    127.0.0.1 # web mode bind address. 127.0.0.1 = private (view via
    #   ssh -L 8008:localhost:8008 pi@<host>, then browse
    #   http://localhost:8008/). Set 0.0.0.0 to expose the
    #   feed directly on the LAN (unauthenticated — only on
    #   a trusted home network).
  preview_port: 8008 # web mode: browse to http://<host>:<port>/
  preview_scale: 1.0 # enlarge the 640x480 view (e.g. 1.5 = 960x720)
  detect_interval_s:
    0.1 # min seconds between detections (~10/s) for near
    # real-time presence. Each is an HTTP round trip +
    # GPU YOLO11x — fine on LAN/Tailscale when compute
    # isn't the limit. Raise toward 0.4 if the tunnel
    # or GPU gets saturated; 0 = as fast as possible.

  # On a visual turn ZERO hands the multimodal LLM a few RECENT frames (not one
  # frozen pose) so it can see motion/action — a raised hand, someone mid-turn.
  frames_per_look:
    2 # keyframes sent per visual turn (2-3 shows motion; 1 =
    # single frame). Each is a small JPEG over the tunnel.
  look_window_s: 1.0 # sample those frames from roughly the last N seconds.

    # BRIO exposes /dev/video0-3; only video0 (index 0) is the capture node,
    # the others are metadata and fail to open. If 0 ever gives no frames on a
    # re-enumeration, try 2 (the BRIO's second capture node).
  camera:
    index: 0
    width: 640 # stream geometry — small so YOLO11n keeps up on the Pi
    height: 480
    request_fps: 30
    mjpg:
      true # request MJPG from the camera. USB webcams (BRIO) can't
      # sustain raw YUYV at this res/fps and return no frames;
      # MJPG fixes it. Set false only if your camera lacks MJPG.

  detect:
    # OPEN-VOCABULARY reflex eye (Phase 1): a YOLO-World export whose 187
    # classes come from scripts/vocab_indoor.txt — edit the vocab + re-export to
    # change them. Exported at imgsz=480: on-CPU it runs ~2x faster than the 640
    # export and detects MORE in normal scenes; it only loses very small objects,
    # which the GPU eye covers. Fall back to yolo11s.onnx (COCO-80, imgsz 640)
    # if the world model misbehaves on the Pi.
    model_path: yolov8s-worldv2-480.onnx # ONNX (NMS baked in) — onnxruntime, NO torch
    confidence: 0.30 # YOLO-World scores run lower than closed-set YOLO11 —
      # 0.35 dropped real objects (measured); 0.30 recovers them
    iou: 0.45 # informational: NMS is already inside the ONNX graph
    device: cpu # 'cpu' (Pi) | 'cuda' (onnxruntime CUDA EP, if present)
    imgsz: 480 # must match what export_yolo_onnx.py used
    classes: [] # class names to keep. [] = keep ALL (recommended:
      # "identify many objects"). List specific names to
      # filter, e.g. [person, cup, laptop].

    # ── Open vocabulary (YOLO-World) ─────────────────────────────────────────
    # To go BEYOND the 80 COCO classes, export a YOLO-World model with a custom
    # prompt vocabulary (scripts/export_yolo_onnx.py --vocab scripts/vocab_indoor.txt)
    # and point model_path at it. The exporter writes a sibling "<model>.names.json"
    # holding the prompt words; the detector auto-loads it (no config needed), but
    # you can force a specific list here:
    names_path: # e.g. yolo_world.names.json — blank = auto-detect / COCO-80

  color:
    top_n:
      0 # 0 = skip pixel color-naming entirely. The multimodal
      # LLM reads real colors off the frame, and pixel-sampled
      # names ("blue person") were the clinical-sounding source.
      # Raise only if you run text-only (no keyframes to the LLM).
    center_crop: 0.6
    min_saturation: 50
    min_value: 40
    white_value: 200
    min_colorful_ratio: 0.10
    min_pixels: 50

  gpu:
    # Grounded distance + bearing from the GPU vision server (Depth Anything V2).
    # OFF by default now: distances/bearings read as clinical and are no longer on
    # the speech path — the multimodal LLM sees position straight from the frames.
    # The server code stays in server/vision/ for optional/experimental use; flip
    # this back on only if you deliberately want depth facts again.
    enabled: false
    url: http://127.0.0.1:8000
    health_path: /health
    facts_path: /facts
    analyze_path:
      /analyze # long-tail naming: the Qwen2-VL VLM (server/vision/vlm)
      # describes objects the COCO/YOLO-World detector can't.
    health_timeout_s: 5.0 # snappy so fallback to local-only is quick
    facts_timeout_s: 15.0
    analyze_timeout_s: 30.0 # the VLM is heavier than depth-only /facts
    jpeg_quality: 80 # keyframe JPEG quality sent up the tunnel

    # When multimodal:false (the main LLM can't see), route VISUAL turns to the GPU
    # VLM so ZERO can still name arbitrary objects from the frame. Ignored when the
    # main LLM is multimodal (it already sees the keyframes directly).
    vlm_fallback: false

# ── World state (Phase 2): three perception tiers, one live scene graph ─────
# Tier 0 (motion, every frame) and Tier 1 (open-vocab detection + tracking,
# motion-gated) feed a versioned WorldState; the LLM context, memory and the
# proactive engine READ from it instead of triggering their own analyses.
world:
  enabled: true
  motion: # Tier 0 — frame differencing, runs on every frame (~ms)
    downscale_w: 160 # analysis width; smaller = cheaper + less sensitive
    pixel_delta: 25 # gray-level change for a pixel to count as "moved"
    threshold: 0.02 # fraction of moved pixels => motion is active
    quiet_frames: 15 # consecutive still frames before motion switches off
  gate: # Tier 1 cadence, driven by Tier 0 (sparse firing)
    active_interval_s: 0.0 # detection interval while scene is moving (0 = every frame)
    idle_interval_s: 2.0 # keepalive detection interval while still
    linger_s: 3.0 # keep full cadence this long after motion stops
  surprise: # Phase 3 — prediction error routes attention & memory
    enabled: true
    stats_path: data/world_surprise.json # ZERO's accumulated sense of "normal"
    remember_bits: 4.0 # events at least this surprising become episodes
    narrate_bits: 6.0 # ...and this surprising wake the Tier 2 narrator
  vocab_export:
    checkpoint: yolov8s-worldv2.pt # used by nightly vocab re-export (consolidate.py)
  budgets: # hard per-tier compute ceilings (sparse firing, enforced)
    tier1_max_duty: 0.6 # detector may use at most this fraction of loop time
    tier2_max_per_min: 20 # narrator inferences per minute, pokes included
  narrator: # Tier 2 — streaming scene understanding into the world state
    # OFF by default: every tick costs a VLM inference on the shared GPU.
    # backend "analyze" reuses the vision server's /analyze (Qwen2-VL) — needs
    # vision.gpu.enabled: true. backend "openai" points at any OpenAI-compatible
    # vision server: the Cosmos 3 Nano Reasoner slot (server/cosmos/) — moving
    # Tier 2 to a second GPU/edge box is just this url, no code change.
    enabled: false
    backend: analyze # 'analyze' | 'openai'
    interval_s: 3.0 # narration cadence; it self-skips while nothing changes
    narration_max_age_s: 20.0 # older narration is stale — dropped from context
    url: http://127.0.0.1:9200 # openai backend only
    model: nvidia/Cosmos3-Nano # openai backend only
    timeout_s: 20.0

# Persona: the system prompt lives in zero/llm/persona.py (SYSTEM_TEMPLATE) —
# edit it there. (It used to be templated from here, but the values were no
# longer substituted, so the dead keys were removed.)
