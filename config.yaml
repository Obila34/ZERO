  output_device: pipewire
  room:
    quiet_rms: 120
    loud_rms: 900
    max_boost: 1.6
    min_boost: 0.75
  aec:
    enabled: false
    filter_ms: 200
privacy:
  bystander_mode: guarded
  indicator_gpio_pin: null
control:
  enabled: true
  host: 0.0.0.0
  port: 8090
  person_id: 1
conversation:
  sleep_timeout_ms: 30000
